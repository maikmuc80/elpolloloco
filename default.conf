# nginx ships no MIME type for .wav or .ttf, so both would go out as
# application/octet-stream. On its own a browser usually copes, but together
# with the nosniff header below it refuses them outright — the game would lose
# its font and its sound effects without a single error showing up anywhere.
#
# This block sits at http level, the same context in which nginx.conf includes
# the stock mime.types, so the two entries are added to that table. Including
# mime.types again here would define every extension twice and nginx would
# refuse to start.
types {
    audio/wav     wav;
    font/ttf      ttf;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik sits in front of this container and writes no access log, so this
    # is the only place in the chain that records requests at all.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # PNG and MP3 are already compressed and gain nothing from another pass.
    # WAV is raw PCM and does shrink noticeably, and thanks to the cache below
    # a visitor pays that cost only once.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml font/ttf audio/wav;

    # Sprites, sounds and the font do not change within a release, but their
    # names carry no content hash. A year of "immutable" would therefore be
    # wrong: a replaced sprite would never reach anyone. A week is the trade —
    # returning players load the six megabytes once, a swapped asset is through
    # everywhere after seven days at the latest.
    location ~* \.(png|jpe?g|gif|svg|ico|mp3|wav|ttf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Everything else: the two HTML files, the stylesheet and the 21 scripts.
    # They change with every deploy and carry no hash either, so they must be
    # revalidated. no-cache does not mean "do not store" but "ask before using"
    # — the browser gets a 304 unless something really changed. Without it a
    # fix ships that nobody sees.
    #
    # add_header does not inherit into a location once that location sets one
    # of its own, which is why the headers are repeated here rather than being
    # declared once at server level.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        # No Content-Security-Policy on purpose. The markup drives the game
        # through inline handlers (onclick, ontouchstart, onload); any policy
        # without 'unsafe-inline' stops the game from starting, and one with it
        # would protect nothing.
    }
}
