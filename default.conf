# nginx ships no MIME type for .wav or .ttf, so both would go out as
# application/octet-stream. On its own a browser usually copes, but together
# with the nosniff header below it refuses them outright — the game would lose
# its font and its sound effects without a single error showing up anywhere.
#
# This block sits at http level, the same context in which nginx.conf includes
# the stock mime.types, so the two entries are added to that table. Including
# mime.types again here would define every extension twice and nginx would
# refuse to start. Putting the block inside server or location would be worse
# still: there it replaces the inherited table instead of extending it, and
# every file would turn into octet-stream.
types {
    audio/wav     wav;
    font/ttf      ttf;
}

# PNG and MP3 are already compressed and only cost CPU on a second pass. WAV is
# raw PCM and would shrink, but compressing it drops Accept-Ranges, and an
# audio element that cannot request byte ranges has to buffer the whole file
# before it plays. Left out on purpose.
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types        text/css text/javascript application/javascript
                  application/json image/svg+xml font/ttf;

# Without this every log line would carry the Docker address of the Coolify
# proxy instead of the visitor. Only private ranges are trusted — with a public
# range any client could claim to come from anywhere.
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Traefik sits in front of this container and writes no access log, so this
    # is the only place in the chain that records requests at all.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Sprites, sounds and the font do not change within a release, but their
    # names carry no content hash. A year of "immutable" would therefore be
    # wrong: a replaced sprite would never reach anyone. A week is the trade —
    # returning players load the six megabytes once, a swapped asset is through
    # everywhere after seven days at the latest.
    #
    # Only add_header here, never the expires directive as well: the two write
    # to different structures and the response would carry two contradicting
    # Cache-Control lines.
    location ~* \.(png|jpe?g|gif|svg|ico|mp3|wav|ttf|woff2?)$ {
        add_header Cache-Control          "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;

        # The game preloads all 205 sprites on start, so one first-time visitor
        # produces well over two hundred lines. That buries everything worth
        # reading.
        access_log off;
    }

    # Everything else: the two HTML files, the stylesheet and the 21 scripts.
    # They change with every deploy and carry no hash either, so they must be
    # revalidated. no-cache does not mean "do not store" but "ask before using"
    # — the browser gets a 304 of a few hundred bytes unless something really
    # changed. Without it a fix ships that nobody sees.
    #
    # add_header does not inherit into a location that sets one of its own,
    # which is why the headers are repeated here instead of being declared once
    # at server level.
    location / {
        try_files $uri $uri/ =404;

        add_header Cache-Control          "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # fullscreen and autoplay are deliberately absent: the game offers a
        # fullscreen button and plays sound, and listing a feature here would
        # switch it off.
        add_header Permissions-Policy     "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

        # script-src and style-src need 'unsafe-inline' because the markup
        # drives the game through inline handlers (onload, onclick,
        # ontouchstart). That does hand back most of the XSS protection, and it
        # is worth being honest about. What remains is still useful: nothing
        # can be pulled from a foreign host, plugins are off, and the base tag
        # cannot be hijacked to redirect every relative path in the game.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }
}
